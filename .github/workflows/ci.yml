name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.12.0, 24]
        typescript: [5.9.3, 6.0.3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select the supported peer compiler
        run: npm install --no-save --ignore-scripts --no-audit --no-fund typescript@${{ matrix.typescript }}
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
